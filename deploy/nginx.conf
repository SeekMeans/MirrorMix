# 云服务器上的 nginx，放到 /etc/nginx/conf.d/mirrormix.conf。
# 证书由 acme.sh 通过阿里云 DNS 签发并自动续期，装到 /etc/nginx/ssl/mm.seekmeans.cn/。
# 这里不加网页密码，直接进 MirrorMix 的 Windows 账户登录页。

# 实时推送和网页里的命令行走 WebSocket，需要把升级请求原样转给 frps。
map $http_upgrade $mirrormix_connection {
    default upgrade;
    ''      close;
}

# 登录接口按来源 IP 限速：每个 IP 每分钟最多 10 次，防止有人反复试密码。
limit_req_zone $binary_remote_addr zone=mirrormix_login:10m rate=10r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.mm.seekmeans.cn;

    ssl_certificate     /etc/nginx/ssl/mm.seekmeans.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mm.seekmeans.cn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mirrormix:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location = /api/login {
        limit_req zone=mirrormix_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        # frps 只监听本机 8080，按 Host 里的子域名找到对应的电脑。
        proxy_pass http://127.0.0.1:8080;

        # Host 要原样转发：frps 靠它分电脑，MirrorMix 靠它核对请求来源。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mirrormix_connection;

        # 回复是一点点推过来的，不要攒着；连接可能一直开着。
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# 不属于 MirrorMix 的域名或直接用 IP 访问 443 时，直接断开，不暴露任何内容。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/mm.seekmeans.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mm.seekmeans.cn/key.pem;
    return 444;
}
